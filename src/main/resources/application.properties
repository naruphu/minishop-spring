spring.application.name=minishop-spring

spring.datasource.url=jdbc:mysql://localhost:3306/minishop_spring?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
# jwt.secret → khóa bí mật dùng để ký JWT
# jwt.expiration → thời gian sống của token,    ở đây là 1 giờ
jwt.expiration=3600000
